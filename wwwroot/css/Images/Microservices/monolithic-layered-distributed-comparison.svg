<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Monolithic vs Layered vs Distributed Systems</title>
  <desc id="desc">Three panels comparing monolithic, layered, and distributed architecture styles.</desc>
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}
      .h{font-weight:700;font-size:26px;fill:#0f172a}
      .s{font-size:15px;fill:#334155}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
      .m{fill:#dbeafe;stroke:#3b82f6;stroke-width:2}
      .l1{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
      .l2{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .l3{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .d{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
      .db{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
      .arrow{stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="15" y="15" width="1170" height="650" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="100" y="60" class="t h">Monolithic</text>
  <rect x="45" y="90" width="330" height="450" rx="14" class="box"/>
  <rect x="75" y="130" width="270" height="60" rx="8" class="m"/><text x="95" y="168" class="t s">Catalog + Cart + Orders + Payments</text>
  <rect x="75" y="210" width="270" height="60" rx="8" class="m"/><text x="160" y="248" class="t s">Single Codebase</text>
  <rect x="75" y="290" width="270" height="60" rx="8" class="m"/><text x="163" y="328" class="t s">Single Deploy</text>
  <rect x="75" y="390" width="270" height="90" rx="8" class="db"/><text x="165" y="440" class="t s">One Shared DB</text>
  <line x1="210" y1="350" x2="210" y2="390" class="arrow"/>

  <text x="465" y="60" class="t h">Layered Monolith</text>
  <rect x="430" y="90" width="330" height="450" rx="14" class="box"/>
  <rect x="460" y="130" width="270" height="70" rx="8" class="l1"/><text x="545" y="172" class="t s">Presentation</text>
  <rect x="460" y="220" width="270" height="70" rx="8" class="l2"/><text x="575" y="262" class="t s">Business</text>
  <rect x="460" y="310" width="270" height="70" rx="8" class="l3"/><text x="565" y="352" class="t s">Data</text>
  <rect x="460" y="410" width="270" height="70" rx="8" class="db"/><text x="545" y="452" class="t s">Shared Database</text>
  <line x1="595" y1="200" x2="595" y2="220" class="arrow"/>
  <line x1="595" y1="290" x2="595" y2="310" class="arrow"/>
  <line x1="595" y1="380" x2="595" y2="410" class="arrow"/>

  <text x="840" y="60" class="t h">Distributed</text>
  <rect x="815" y="90" width="340" height="450" rx="14" class="box"/>
  <rect x="850" y="130" width="125" height="62" rx="8" class="d"/><text x="867" y="166" class="t s">Catalog Svc</text>
  <rect x="995" y="130" width="125" height="62" rx="8" class="d"/><text x="1018" y="166" class="t s">Order Svc</text>
  <rect x="850" y="222" width="125" height="62" rx="8" class="d"/><text x="865" y="258" class="t s">Payment Svc</text>
  <rect x="995" y="222" width="125" height="62" rx="8" class="d"/><text x="1002" y="258" class="t s">Notify Svc</text>

  <rect x="850" y="330" width="125" height="56" rx="8" class="db"/><text x="885" y="364" class="t s">DB</text>
  <rect x="995" y="330" width="125" height="56" rx="8" class="db"/><text x="1030" y="364" class="t s">DB</text>
  <rect x="850" y="400" width="125" height="56" rx="8" class="db"/><text x="885" y="434" class="t s">DB</text>
  <rect x="995" y="400" width="125" height="56" rx="8" class="db"/><text x="1030" y="434" class="t s">Queue</text>

  <line x1="912" y1="192" x2="912" y2="330" class="arrow"/>
  <line x1="1057" y1="192" x2="1057" y2="330" class="arrow"/>
  <line x1="912" y1="284" x2="912" y2="400" class="arrow"/>
  <line x1="1057" y1="284" x2="1057" y2="400" class="arrow"/>

  <text x="80" y="595" class="t s">Monolithic: fastest start, lowest ops overhead</text>
  <text x="445" y="595" class="t s">Layered: cleaner code, still one deployment unit</text>
  <text x="830" y="595" class="t s">Distributed: best scaling autonomy, highest complexity</text>
</svg>
