<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">E-commerce architecture evolution</title>
  <desc id="desc">Timeline diagram showing monolith to layered monolith to distributed services.</desc>
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}
      .h{font-size:24px;font-weight:700;fill:#0f172a}
      .s{font-size:15px;fill:#334155}
      .card{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
      .mono{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .lay{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .dist{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
      .arr{stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="420" y="52" class="t h">E-commerce Growth Journey</text>

  <rect x="55" y="95" width="320" height="330" rx="14" class="card"/>
  <text x="130" y="130" class="t h">Phase 1: Monolith</text>
  <rect x="90" y="155" width="250" height="140" rx="10" class="mono"/>
  <text x="125" y="188" class="t s">Catalog | Cart | Orders | Payment</text>
  <text x="170" y="216" class="t s">Single Deploy + Single DB</text>
  <text x="108" y="338" class="t s">Best for MVP and small teams.</text>
  <text x="108" y="364" class="t s">Fast feature delivery in early stage.</text>

  <rect x="440" y="95" width="320" height="330" rx="14" class="card"/>
  <text x="490" y="130" class="t h">Phase 2: Layered</text>
  <rect x="475" y="160" width="250" height="55" rx="8" class="lay"/><text x="550" y="194" class="t s">Presentation</text>
  <rect x="475" y="223" width="250" height="55" rx="8" class="lay"/><text x="570" y="257" class="t s">Business</text>
  <rect x="475" y="286" width="250" height="55" rx="8" class="lay"/><text x="588" y="320" class="t s">Data</text>
  <text x="485" y="364" class="t s">Cleaner code and better testing.</text>
  <text x="485" y="390" class="t s">Still one release pipeline.</text>

  <rect x="825" y="95" width="320" height="330" rx="14" class="card"/>
  <text x="855" y="130" class="t h">Phase 3: Distributed</text>
  <rect x="860" y="165" width="120" height="58" rx="8" class="dist"/><text x="882" y="199" class="t s">Order Svc</text>
  <rect x="995" y="165" width="120" height="58" rx="8" class="dist"/><text x="1012" y="199" class="t s">Payment Svc</text>
  <rect x="860" y="235" width="120" height="58" rx="8" class="dist"/><text x="878" y="269" class="t s">Catalog Svc</text>
  <rect x="995" y="235" width="120" height="58" rx="8" class="dist"/><text x="1010" y="269" class="t s">Notify Svc</text>
  <text x="860" y="338" class="t s">Independent scaling and releases.</text>
  <text x="860" y="364" class="t s">Needs observability + DevOps maturity.</text>

  <line x1="375" y1="260" x2="440" y2="260" class="arr"/>
  <line x1="760" y1="260" x2="825" y2="260" class="arr"/>
  <text x="392" y="246" class="t s">growth</text>
  <text x="777" y="246" class="t s">scale</text>
</svg>
