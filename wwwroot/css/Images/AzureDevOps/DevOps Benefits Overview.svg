<svg width="1000" height="600" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions for Text Backgrounds -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5733; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFC300; stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28A745; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#007BFF; stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8E44AD; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E74C3C; stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Center Circle with Segmented Colors -->
  <circle cx="400" cy="200" r="80" fill="none" stroke="url(#gradient1)" stroke-width="20" stroke-dasharray="31.4, 10" stroke-linecap="round"/>
  
  <!-- Center Text -->
  <text x="400" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">
    DEVOPS
  </text>
  <text x="400" y="220" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">
    BENEFITS
  </text>
  
  <!-- Left Side Benefits with Rectangles -->
  <rect x="40" y="85" width="250" height="30" rx="5" fill="url(#gradient1)"/>
  <text x="165" y="105" font-size="16" text-anchor="middle" fill="#FFF">RELIABILITY</text>
  
  <rect x="40" y="125" width="250" height="30" rx="5" fill="url(#gradient2)"/>
  <text x="165" y="145" font-size="16" text-anchor="middle" fill="#FFF">REDUCED TIME TO RECOVER</text>
  
  <rect x="40" y="165" width="250" height="30" rx="5" fill="url(#gradient3)"/>
  <text x="165" y="185" font-size="16" text-anchor="middle" fill="#FFF">EFFICIENCY</text>
  
  <rect x="40" y="205" width="250" height="30" rx="5" fill="url(#gradient1)"/>
  <text x="165" y="225" font-size="16" text-anchor="middle" fill="#FFF">LOWER RISK</text>
  
  <rect x="40" y="245" width="250" height="30" rx="5" fill="url(#gradient2)"/>
  <text x="165" y="265" font-size="16" text-anchor="middle" fill="#FFF">SHORTER DEV CYCLE</text>
  
  <rect x="40" y="285" width="250" height="30" rx="5" fill="url(#gradient3)"/>
  <text x="165" y="305" font-size="16" text-anchor="middle" fill="#FFF">STABILITY</text>
  
  <!-- Right Side Benefits with Rectangles -->
  <rect x="510" y="85" width="250" height="30" rx="5" fill="url(#gradient1)"/>
  <text x="635" y="105" font-size="16" text-anchor="middle" fill="#FFF">FASTER UPDATES</text>
  
  <rect x="510" y="125" width="250" height="30" rx="5" fill="url(#gradient2)"/>
  <text x="635" y="145" font-size="16" text-anchor="middle" fill="#FFF">BETTER USER EXPERIENCE</text>
  
  <rect x="510" y="165" width="250" height="30" rx="5" fill="url(#gradient3)"/>
  <text x="635" y="185" font-size="16" text-anchor="middle" fill="#FFF">FEWER FAILURES</text>
  
  <rect x="510" y="205" width="250" height="30" rx="5" fill="url(#gradient1)"/>
  <text x="635" y="225" font-size="16" text-anchor="middle" fill="#FFF">HIGHER QUALITY</text>
  
  <rect x="510" y="245" width="250" height="30" rx="5" fill="url(#gradient2)"/>
  <text x="635" y="265" font-size="16" text-anchor="middle" fill="#FFF">FASTER PRODUCT DELIVERY</text>
  
  <rect x="510" y="285" width="250" height="30" rx="5" fill="url(#gradient3)"/>
  <text x="635" y="305" font-size="16" text-anchor="middle" fill="#FFF">COST SAVINGS</text>
</svg>