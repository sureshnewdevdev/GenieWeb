<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="100%" height="100%" fill="#f5f7fa"/>

    <!-- Title -->
    <text x="400" y="40" font-size="22" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#003366">
        Cloud Computing Architecture
    </text>

    <!-- Front End Section -->
    <rect x="270" y="80" width="260" height="50" fill="#ff6f61" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="400" y="110" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">
        Client Infrastructure
    </text>

    <!-- Internet -->
    <ellipse cx="400" cy="180" rx="80" ry="40" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <text x="400" y="185" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">
        Internet
    </text>

    <!-- Vertical Arrow Symbol -->
    <text x="400" y="140" font-size="22" font-family="Arial" font-weight="bold" text-anchor="middle" fill="black">
        ↕
    </text>
    <text x="400" y="235" font-size="22" font-family="Arial" font-weight="bold" text-anchor="middle" fill="black">
        ↕
    </text>

    <!-- Back End Section -->
    <rect x="100" y="240" width="600" height="330" fill="#ffcccc" stroke="#c0392b" stroke-width="2" rx="10"/>

    <!-- Management & Security Blocks -->
    <rect x="130" y="280" width="80" height="250" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
    <text x="170" y="420" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white" transform="rotate(-90,170,400)">
        Management
    </text>
    <rect x="590" y="280" width="80" height="250" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
    <text x="630" y="420" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white" transform="rotate(-90,630,400)">
        Security
    </text>

    <!-- Layers with Numbered Labels (Perfectly Aligned to the Left of Ellipses) -->
    <g font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">
        <circle cx="240" cy="280" r="20" fill="#16a085"/>
        <text x="240" y="286" fill="white">2</text>
        <ellipse cx="400" cy="280" rx="150" ry="30" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
        <text x="400" y="285" fill="white">Application</text>

        <circle cx="245" cy="330" r="20" fill="#16a085"/>
        <text x="245" y="336" fill="white">3</text>
        <ellipse cx="400" cy="330" rx="140" ry="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
        <text x="400" y="335" fill="white">Service</text>

        <circle cx="255" cy="380" r="20" fill="#16a085"/>
        <text x="255" y="386" fill="white">4</text>
        <ellipse cx="400" cy="380" rx="130" ry="26" fill="#bb6bd9" stroke="#9b59b6" stroke-width="2"/>
        <text x="400" y="385" fill="white">Runtime Cloud</text>

        <circle cx="265" cy="430" r="20" fill="#16a085"/>
        <text x="265" y="436" fill="white">5</text>
        <ellipse cx="400" cy="430" rx="120" ry="30" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
        <text x="400" y="435" fill="white">Storage</text>

        <circle cx="275" cy="480" r="20" fill="#16a085"/>
        <text x="275" y="486" fill="white">6</text>
        <ellipse cx="400" cy="480" rx="110" ry="30" fill="#2c3e50" stroke="#1c2833" stroke-width="2"/>
        <text x="400" y="485" fill="white">Infrastructure</text>
    </g>

    <!-- Numbered Labels for Management, Security, Internet, and Client Infrastructure -->
    <circle cx="240" cy="100" r="20" fill="#16a085"/>
    <text x="240" y="106" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">1</text>

    
    <circle cx="140" cy="260" r="20" fill="#16a085"/>
    <text x="140" y="266" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">7</text>

    <circle cx="660" cy="260" r="20" fill="#16a085"/>
    <text x="660" y="266" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">8</text>

    <circle cx="240" cy="180" r="20" fill="#16a085"/>
    <text x="240" y="186" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle" fill="white">9</text>
</svg>
